{% extends "base.html" %}
{% set seo = c.seo %}
{% block content %}
<section class="section page-hero">
  <div class="container">
    <p class="kicker mono">faq</p>
    <h1>{{ c.title }}</h1>
  </div>
</section>
<section class="section">
  <div class="container faq">
    {% for s in c.sections %}
    <h2>{{ s.title }}</h2>
    {% for item in s.questions %}
    <details class="faq-item">
      <summary>{{ item.q }}</summary>
      <p>{{ item.a }}</p>
    </details>
    {% endfor %}
    {% endfor %}
  </div>
</section>
{% endblock %}
