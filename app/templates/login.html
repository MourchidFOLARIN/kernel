{% extends "base.html" %}
{% set seo = c.seo %}
{% block content %}
<section class="section">
  <div class="container narrow auth-box">
    <p class="kicker mono">connexion</p>
    <h1>{{ c.title }}</h1>
    <form class="form" id="login-form" data-form="login">
      <input type="hidden" name="csrf_token" value="{{ csrf }}">
      <label>Pseudo ou e-mail
        <input name="username" required maxlength="254" autocomplete="username">
      </label>
      <label>Mot de passe
        <input type="password" name="password" required maxlength="128" autocomplete="current-password">
      </label>
      <p class="form-msg" role="status" hidden></p>
      <button class="btn btn-primary" type="submit">{{ c.submit }}</button>
    </form>
    <p><a href="/mot-de-passe-oublie">{{ c.forgot }}</a></p>
    <p class="muted">{{ c.no_account }} <a href="/rejoindre">Rejoindre</a></p>
  </div>
</section>
{% endblock %}
{% block scripts %}<script type="module" src="{{ static }}/js/forms.js"></script>{% endblock %}
